name: Release

on:
  push:
    tags:
      # semver only — `v*` also caught things like `v0.7.0-rc` or a stray `vnext`.
      - "v*.*.*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # goreleaser needs the full history and the tags to build the changelog.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # track the toolchain declared in go.mod so CI and go.mod never drift.
          go-version-file: go.mod
          cache: true

      # goreleaser's own `.TagBody` is read through a cleaner that strips every
      # apostrophe, so the note has to reach it as a plain file instead. It
      # lands outside the checkout because goreleaser refuses to release from a
      # tree with untracked files in it.
      - name: Lift the release note out of the tag
        env:
          TAG: ${{ github.ref_name }}
        run: git tag -l --format='%(contents:body)' "${TAG}" > "${RUNNER_TEMP}/release-header.md"

      - name: Release
        uses: goreleaser/goreleaser-action@v7
        with:
          # pinned to the v2 line that still ships the `brews` formula publisher.
          version: "~> v2.17"
          args: release --clean --release-header=${{ runner.temp }}/release-header.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # a PAT with `contents: write` on cmj0121/homebrew-tap — the workflow's
          # own GITHUB_TOKEN is scoped to this repository only.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Mirror the release note to the tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # the tap carries one release per tool per version, so namespace the
          # tag — a second tool in this tap must not collide with baton's.
          {
            git tag -l --format='%(contents)' "${TAG}"
            printf '\n---\n\n'
            printf 'Install: `brew install cmj0121/tap/baton`\n\n'
            printf 'Full release: https://github.com/cmj0121/baton/releases/tag/%s\n' "${TAG}"
          } > tap-note.md
          gh release create "baton-${TAG}" \
            --repo cmj0121/homebrew-tap \
            --title "baton ${TAG}" \
            --notes-file tap-note.md
